meters:
- name: unique_track_analysis
  description: First-time analysis of a unique track, billed per track at a volume-banded EUR rate.
  unit: tracks
  aggregation: sum
  dimensions:
  - account
  - volume_band
- name: balance_topup
  description: Prepaid funds added to the account balance via Stripe (non-refundable).
  unit: currency
  aggregation: sum
  dimensions:
  - account
- name: free_recommendation_calls
  description: Calls to the free recommendation endpoints (similar, feature-target, mixed); no charge.
  unit: requests
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track the count of unique first-time track analyses per month and the volume band you land in; monitor prepaid balance burn-down.
- name: Allocation
  description: Attribute unique-track analysis charges to the product or playlist workflow that requested them via API-key or account segmentation.
- name: Optimization
  description: Deduplicate track IDs before calling analysis so already-analyzed tracks are read for free; batch to reach lower per-track volume bands; lean on the free recommendation endpoints where possible.
- name: Accountability
  description: Set a prepaid-balance ceiling per period and review unique-analysis volume against it; because top-ups are non-refundable, budget conservatively.
