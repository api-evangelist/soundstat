description: >-
  FinOps view of SoundStat spend. SoundStat bills on a prepaid, usage-based model:
  you add funds to a balance via Stripe and are charged per unique track analyzed,
  with the per-track rate stepping down across volume bands (EUR 0.01 down to EUR
  0.005 per track). Registration and three recommendation endpoints (similar,
  feature-target, mixed) are free, and re-reading an already-analyzed track incurs
  no new charge - so the dominant cost driver is the count of first-time unique
  track analyses per month. Balance top-ups are non-refundable.
notes: >-
  Per-track EUR rates are taken from the SoundStat terms page and are not
  reconciled here; verify current pricing before budgeting. The single most
  important optimization lever is deduplicating track IDs so you never pay twice
  to analyze the same track.
