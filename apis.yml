aid: soundstat
url: https://raw.githubusercontent.com/api-evangelist/soundstat/refs/heads/main/apis.yml
name: SoundStat
kind: company
description: SoundStat is an independent audio analysis API that returns detailed
  per-track features - tempo (BPM), key, mode, energy, danceability, valence,
  instrumentalness, acousticness, loudness, plus segment and beat structure - for
  music tracks referenced by Spotify track ID. Launched in early 2025 as an
  alternative after Spotify deprecated its public audio-features and
  recommendations endpoints, SoundStat has analyzed several million tracks and
  layers a rich recommendation engine (similar, feature-target, mixed-seed, mood,
  activity, time-of-day, cross-genre, DJ-compatible, contrast, hidden-gems, and
  more) plus genre-and-feature search on top of its analysis corpus. The REST API
  is authenticated with an x-api-key header and billed per unique track analyzed.
